<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Consumer</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #f7f7f8;
        color: #1f2328;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #d8dee4;
        border-radius: 10px;
        padding: 20px;
      }

      h1 {
        margin-top: 0;
        font-size: 1.3rem;
      }

      #status {
        margin-bottom: 16px;
        font-weight: 600;
      }

      #statusDetail {
        margin-top: -10px;
        margin-bottom: 16px;
      }

      ul {
        margin: 0;
        padding-left: 20px;
      }

      li {
        margin: 6px 0;
      }

      .enabled {
        color: #0a7f3f;
        font-weight: 600;
      }

      .disabled {
        color: #a11d2d;
        font-weight: 600;
      }

      .muted {
        color: #59636e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Feature Flags SDK Test Consumer</h1>
      <p id="status">Connecting...</p>
      <p id="statusDetail" class="muted"></p>
      <ul id="flags"></ul>
      <p id="empty" class="muted" hidden>No flags loaded.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/centrifuge@5.2.2/dist/centrifuge.js"></script>
    <script src="/runtime-config.js"></script>
    <script src="/consumer-sdk.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
